name: 3D Contrib

on:
  schedule: [{ cron: "0 18 * * *" }] # 毎日 (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Remove radar chart (Issue/PR counts) from SVGs
        run: |
          python3 - << 'PY'
          import re, glob
          for f in glob.glob('profile-3d-contrib/*.svg'):
              s = open(f).read()
              i = s.find('class="axis"')
              if i < 0:
                  continue
              j = s.rfind('<g transform="translate', 0, i)
              depth, end = 0, -1
              for m in re.finditer(r'</?g\b[^>]*>', s[j:]):
                  if m.group(0).startswith('</'):
                      depth -= 1
                      if depth == 0:
                          end = j + m.end()
                          break
                  else:
                      depth += 1
              if end > 0:
                  open(f, 'w').write(s[:j] + s[end:])
          PY

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .
          git diff --cached --quiet || git commit -m "Generate 3D contrib"
          git push
